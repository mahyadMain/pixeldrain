name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL"
        required: true
        type: string

      volume:
        description: "Audio volume multiplier"
        required: false
        default: "0.20"
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:

      # --------------------------------------------------
      # 1. Install tools
      # --------------------------------------------------

      - name: Install yt-dlp, FFmpeg, Deno
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg p7zip-full
          python3 -m pip install -U yt-dlp

          # yt-dlp needs a JS runtime to fully parse YouTube's page
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # 2. Restore cookies (needed to pass YouTube's bot check)
      # --------------------------------------------------

      - name: Write cookies file
        env:
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: |
          if [ -z "${YT_COOKIES_B64:-}" ]; then
            echo "::warning::No YT_COOKIES_B64 secret set — download will likely fail with 'Sign in to confirm you're not a bot'."
          else
            echo "$YT_COOKIES_B64" | base64 -d > cookies.txt
          fi

      # --------------------------------------------------
      # 3. Download YouTube video
      # --------------------------------------------------

      - name: Download video
        env:
          URL: ${{ inputs.youtube_url }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p work

          COOKIE_ARGS=()
          if [ -f cookies.txt ]; then
            COOKIE_ARGS=(--cookies cookies.txt)
          fi

          yt-dlp \
            --newline \
            --progress \
            --no-color \
            --js-runtimes deno \
            "${COOKIE_ARGS[@]}" \
            --format "bv*[height<=720]+ba/b[height<=720]" \
            --merge-output-format mp4 \
            --no-playlist \
            --output "work/source.%(ext)s" \
            "$URL"

          echo "---- Downloaded file info ----"
          ls -lh work/
          du -sh work/source.mp4

      # --------------------------------------------------
      # 4. Compress / normalize video
      # --------------------------------------------------

      - name: Compress to 720p low bitrate
        env:
          VOLUME: ${{ inputs.volume }}
        run: |
          mkdir -p output

          ffmpeg \
            -i work/source.mp4 \
            -vf "scale=-2:720" \
            -c:v libx264 \
            -preset veryfast \
            -b:v 550k \
            -maxrate 650k \
            -bufsize 1100k \
            -c:a aac \
            -b:a 32k \
            -ac 1 \
            -af "volume=${VOLUME}" \
            -movflags +faststart \
            -map_metadata -1 \
            -nostats -loglevel info -progress pipe:1 \
            "output/video.mp4"

          echo "---- Compressed file info ----"
          ls -lh output/
          du -sh output/video.mp4

      # --------------------------------------------------
      # 5. Split into ~350 MB pieces
      # --------------------------------------------------

      - name: Split into parts
        run: |
          mkdir -p parts

          7z \
            -v350m \
            -mx=0 \
            a parts/video.7z \
            output/video.mp4

          echo "---- Split parts ----"
          ls -lh parts/

      # --------------------------------------------------
      # 6. Create GitHub Release
      # --------------------------------------------------

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "download-${{ github.run_number }}" \
            parts/* \
            --title "YouTube Download ${{ github.run_number }}" \
            --notes "720p compressed video split into 350 MB parts."
