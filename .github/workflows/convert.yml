name: Convert video

on:
  workflow_dispatch:
    inputs:
      pixeldrain_url:
        description: "Pixeldrain video URL"
        required: true
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download video
        env:
          PIXELDRAIN_URL: ${{ inputs.pixeldrain_url }}
        run: |
          URL="${PIXELDRAIN_URL%/}"
          FILE_ID="${URL##*/}"

          echo "File ID: $FILE_ID"
          echo "Downloading from Pixeldrain..."

          wget --content-disposition \
            -O input.mp4 \
            "https://pixeldrain.com/api/file/${FILE_ID}?download"

      - name: Check downloaded file
        run: |
          ls -lh input.mp4
          file input.mp4

      - name: Convert to 720p
        run: |
          ffmpeg -i input.mp4 \
            -vf "scale=-2:720" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            output_720p.mp4

      - name: Upload converted video
        uses: actions/upload-artifact@v4
        with:
          name: converted-video
          path: output_720p.mp4
