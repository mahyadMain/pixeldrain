name: Convert video

on:
  workflow_dispatch:
    inputs:
      pixeldrain_url:
        description: "Pixeldrain video URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download video
        env:
          PIXELDRAIN_URL: ${{ inputs.pixeldrain_url }}
        run: |
          # Strip any query string/fragment that might have been pasted in
          # along with the link.
          URL="${PIXELDRAIN_URL%%\?*}"
          URL="${URL%%#*}"

          # Pixeldrain links come in two shapes:
          #   pixeldrain.com/d/{ID}
          #   pixeldrain.com/d/{ID}/{display-filename}
          # Extract the ID right after "/d/" or "/u/" so a trailing
          # filename segment doesn't get mistaken for the ID.
          FILE_ID=$(echo "$URL" | sed -E 's#.*pixeldrain\.com/[du]/([^/?#]+).*#\1#')

          if [ -z "$FILE_ID" ] || [ "$FILE_ID" = "$URL" ]; then
            echo "ERROR: Could not extract a Pixeldrain file ID from: $PIXELDRAIN_URL"
            exit 1
          fi

          echo "Pixeldrain URL: $URL"
          echo "File ID: $FILE_ID"

          # Check the file actually exists before attempting the full
          # download, so failures are easy to diagnose.
          INFO_JSON=$(curl -s "https://pixeldrain.com/api/file/${FILE_ID}/info")
          echo "Info response: $INFO_JSON"

          SUCCESS=$(echo "$INFO_JSON" | grep -o '"success":[a-z]*' | cut -d: -f2)

          if [ "$SUCCESS" != "true" ]; then
            echo "ERROR: Pixeldrain has no file with ID '$FILE_ID'."
            echo "Double check the link is correct, public, and not deleted/expired."
            exit 1
          fi

          HTTP_CODE=$(curl -L \
            -o input.mp4 \
            -w "%{http_code}" \
            "https://pixeldrain.com/api/file/${FILE_ID}?download")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Pixeldrain returned HTTP $HTTP_CODE on download"
            exit 1
          fi

      - name: Check downloaded file
        run: |
          ls -lh input.mp4
          file input.mp4

      - name: Convert to 720p
        run: |
          ffmpeg -i input.mp4 \
            -vf "scale=-2:720" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            output_720p.mp4

      - name: Put video in download folder
        run: |
          mkdir -p download
          mv output_720p.mp4 download/output_720p.mp4

      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add download/output_720p.mp4

          git commit -m "Add converted 720p video"

          git push
