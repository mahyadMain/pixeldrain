name: Convert video

on:
  workflow_dispatch:
    inputs:
      pixeldrain_url:
        description: "Pixeldrain video URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download video
        env:
          PIXELDRAIN_URL: ${{ inputs.pixeldrain_url }}
        run: |
          URL="${PIXELDRAIN_URL%/}"
          FILE_ID="${URL##*/}"

          echo "Pixeldrain URL: $URL"
          echo "File ID: $FILE_ID"

          HTTP_CODE=$(curl -L \
            -o input.mp4 \
            -w "%{http_code}" \
            "https://pixeldrain.com/api/file/${FILE_ID}?download")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Pixeldrain returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Check downloaded file
        run: |
          ls -lh input.mp4
          file input.mp4

      - name: Convert to 720p
        run: |
          ffmpeg -i input.mp4 \
            -vf "scale=-2:720" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            output_720p.mp4

      - name: Put video in download folder
        run: |
          mkdir -p download
          mv output_720p.mp4 download/output_720p.mp4

      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add download/output_720p.mp4

          git commit -m "Add converted 720p video"

          git push
